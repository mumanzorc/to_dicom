services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dicom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-dicom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dicom}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    ports: ["8866:8866"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dicom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dicom}
      STORAGE_DIR: /app/archivos_dicom
    volumes:
      - dicom_files:/app/archivos_dicom
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  dicom_files:
