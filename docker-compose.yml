YAML

version: '3.8'

services:
  backend_dicom:
    build: .
    container_name: gestor_dicom_api
    ports:
      - "8866:8866" # <-- NUEVO PUERTO
    environment:
      - gestor_dicom_api_SECURE_COOKIE=false # <-- VARIABLE AGREGADA
    volumes:
      - ./archivos_recibidos:/app/archivos_recibidos
    restart: always # <-- INICIA AUTOMÁTICAMENTE CON EL SERVIDOR
