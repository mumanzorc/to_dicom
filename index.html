<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DICOM Convert</title>
<style>:root{font-family:Inter,system-ui;color:#18212f;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 8px 30px #23334d14}.login{max-width:430px;margin:9vh auto}h1{margin:0 0 8px}p{color:#657184}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #ced6e2;border-radius:8px;margin:5px 0 14px}button{border:0;border-radius:8px;padding:10px 14px;background:#1769e0;color:#fff;cursor:pointer}.danger{background:#c83939}.muted{background:#677386}.success{background:#11845b}.hidden{display:none}.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}.top button:last-child{margin-left:auto}.tabs{display:flex;gap:8px}.tab.active{background:#0d4fae}.panel{margin-top:20px}.drop{border:2px dashed #aebbcf;border-radius:12px;padding:28px;text-align:center;background:#f8fafc}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e7ef;font-size:14px}th{background:#f6f8fb}.actions{display:flex;gap:5px}.actions button{padding:6px 9px}.msg{margin-top:12px;white-space:pre-wrap}.error{color:#bb2d3b}@media(max-width:700px){.grid{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.table-wrap{overflow:auto}}</style></head><body>
<main class="shell"><section id="login" class="card login"><h1>DICOM Convert</h1><p>Conversión segura de documentos a DICOM</p><label>Correo</label><input id="email" type="email" value="admin@dicom.local"><label>Contraseña</label><input id="pass" type="password" value="Cambiar123!"><button onclick="signIn()">Ingresar</button> <button class="muted" onclick="forgot()">Olvidé mi contraseña</button><div id="loginMsg" class="msg error"></div></section>
<section id="app" class="card hidden"><div class="top"><div><h1>DICOM Convert</h1><small id="who"></small></div><button class="muted" onclick="logout()">Cerrar sesión</button></div><nav class="tabs"><button class="tab active" onclick="show('convert',this)">Convertir</button><button class="tab" onclick="show('files',this);loadFiles()">Archivos DICOM</button><button id="usersTab" class="tab" onclick="show('users',this);loadUsers()">Usuarios</button></nav>
<section id="convert" class="panel"><h2>Convertir archivos</h2><p>JPG, PNG, BMP, PDF, TXT, CSV, JSON, LOG, MD, XML y HTML. Puede seleccionar uno o varios.</p><div class="drop"><input id="uploads" type="file" multiple accept=".jpg,.jpeg,.png,.bmp,.pdf,.txt,.csv,.json,.log,.md,.xml,.html"><button onclick="convertFiles()">Convertir a DICOM</button></div><div id="uploadMsg" class="msg"></div></section>
<section id="files" class="panel hidden"><div class="top"><h2>Archivos DICOM creados</h2><button class="success" onclick="bulkDownload()">Descargar selección</button><button class="danger" onclick="bulkDelete()">Eliminar selección</button></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" onclick="toggleAll(this)"></th><th>Original</th><th>DICOM</th><th>Formato</th><th>Tamaño</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody id="fileRows"></tbody></table></div></section>
<section id="users" class="panel hidden"><div class="top"><h2>Usuarios</h2><button class="success" onclick="editUser()">Nuevo usuario</button></div><div id="userForm" class="hidden"><div class="grid"><input id="uid" type="hidden"><input id="unames" placeholder="Nombres"><input id="ulast" placeholder="Apellidos"><input id="umail" type="email" placeholder="Correo"><input id="uphone" placeholder="Teléfono"><input id="upassword" type="password" placeholder="Contraseña (mín. 8)"><select id="urole"><option value="usuario">Usuario</option><option value="admin">Administrador</option></select><select id="uactive"><option value="true">Activo</option><option value="false">Inactivo</option></select></div><button onclick="saveUser()">Guardar</button> <button class="muted" onclick="userForm.classList.add('hidden')">Cancelar</button></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="userRows"></tbody></table></div></section></section></main>
<script>let token=sessionStorage.token||'',me=null;const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:`Bearer ${token}`}:{})};let r=await fetch(path,opt);if(!r.ok){let e=await r.json().catch(()=>({detail:'Error'}));throw Error(e.detail||'Error')}return r}async function signIn(){try{let b=new URLSearchParams({username:$('email').value,password:$('pass').value});let r=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});let d=await r.json();token=d.access_token;sessionStorage.token=token;me=d.usuario;enter()}catch(e){$('loginMsg').textContent=e.message}}async function enter(){if(!me){try{me=await(await api('/api/auth/me')).json()}catch{return logout()}}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${me.nombres} · ${me.rol}`;$('usersTab').classList.toggle('hidden',me.rol!=='admin')}function logout(){sessionStorage.clear();location.reload()}async function forgot(){let email=prompt('Correo de la cuenta:',$('email').value);if(!email)return;try{let d=await(await api('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correo:email})})).json();alert(d.mensaje+(d.token_desarrollo?`\nToken de desarrollo: ${d.token_desarrollo}`:''));let t=prompt('Ingrese el token recibido:');if(t){let p=prompt('Nueva contraseña (mínimo 8 caracteres):');await api('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,nueva_password:p})});alert('Contraseña actualizada')}}catch(e){alert(e.message)}}function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function convertFiles(){let fd=new FormData();[...$('uploads').files].forEach(f=>fd.append('files',f));if(![...fd].length)return alert('Seleccione archivos');$('uploadMsg').textContent='Procesando…';try{let d=await(await api('/api/archivos',{method:'POST',body:fd})).json();$('uploadMsg').textContent=d.resultados.map(x=>x.ok?`✓ ${x.archivo} → ${x.dicom}`:`✗ ${x.archivo}: ${x.error}`).join('\n')}catch(e){$('uploadMsg').textContent=e.message}}async function loadFiles(){let a=await(await api('/api/archivos')).json();$('fileRows').innerHTML=a.map(x=>`<tr><td><input class="pick" type="checkbox" value="${x.id}"></td><td>${esc(x.nombre_original)}</td><td>${esc(x.nombre_dicom)}</td><td>${x.formato_origen.toUpperCase()}</td><td>${Math.ceil(x.tamano_bytes/1024)} KB</td><td>${new Date(x.fecha_subida+'Z').toLocaleString()}</td><td class="actions"><button onclick="downloadOne(${x.id},'${esc(x.nombre_dicom)}')">Descargar</button><button class="muted" onclick="renameFile(${x.id},'${esc(x.nombre_dicom)}')">Editar</button><button class="danger" onclick="deleteFile(${x.id})">Eliminar</button></td></tr>`).join('')}const ids=()=>[...document.querySelectorAll('.pick:checked')].map(x=>+x.value);function toggleAll(x){document.querySelectorAll('.pick').forEach(y=>y.checked=x.checked)}async function blobDownload(path,opt,name){let r=await api(path,opt),b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function downloadOne(id,n){blobDownload(`/api/archivos/${id}/descargar`,{},n)}async function bulkDownload(){if(!ids().length)return alert('Seleccione archivos');blobDownload('/api/archivos-multiples/descargar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:ids()})},'dicom_seleccionados.zip')}async function renameFile(id,n){let v=prompt('Nuevo nombre DICOM:',n);if(v){await api(`/api/archivos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre_dicom:v})});loadFiles()}}async function deleteFile(id){if(confirm('¿Eliminar este DICOM?')){await api(`/api/archivos/${id}`,{method:'DELETE'});loadFiles()}}async function bulkDelete(){if(ids().length&&confirm('¿Eliminar los archivos seleccionados?')){await api('/api/archivos-multiples/eliminar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:ids()})});loadFiles()}}let userData=[];async function loadUsers(){userData=await(await api('/api/usuarios')).json();$('userRows').innerHTML=userData.map(u=>`<tr><td>${esc(u.nombres+' '+u.apellidos)}</td><td>${esc(u.correo)}</td><td>${u.rol}</td><td>${u.activo?'Activo':'Inactivo'}</td><td class="actions"><button class="muted" onclick="editUser(${u.id})">Editar</button><button class="danger" onclick="deleteUser(${u.id})">Eliminar</button></td></tr>`).join('')}function editUser(id){let u=userData.find(x=>x.id===id)||{};$('uid').value=u.id||'';$('unames').value=u.nombres||'';$('ulast').value=u.apellidos||'';$('umail').value=u.correo||'';$('uphone').value=u.telefono||'';$('upassword').value='';$('urole').value=u.rol||'usuario';$('uactive').value=String(u.activo??true);$('userForm').classList.remove('hidden')}async function saveUser(){let id=$('uid').value,p={nombres:$('unames').value,apellidos:$('ulast').value,correo:$('umail').value,telefono:$('uphone').value,rol:$('urole').value,activo:$('uactive').value==='true'};if($('upassword').value)p.password=$('upassword').value;try{await api('/api/usuarios'+(id?`/${id}`:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});$('userForm').classList.add('hidden');loadUsers()}catch(e){alert(e.message)}}async function deleteUser(id){if(confirm('¿Eliminar o desactivar este usuario?')){try{await api(`/api/usuarios/${id}`,{method:'DELETE'});loadUsers()}catch(e){alert(e.message)}}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)enter();</script></body></html>
